<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fe4"/>
      <stop offset="0.55" stop-color="#1b3b8f"/>
      <stop offset="1" stop-color="#0f1722"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#9cc0ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#9cc0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7e4ff"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
  <!-- branch merging into the main line -->
  <path d="M712 700 C712 590 512 640 512 520" fill="none" stroke="#7fb0ff" stroke-width="52" stroke-linecap="round"/>
  <!-- main line + push arrow -->
  <path d="M512 790 V300" fill="none" stroke="#ffffff" stroke-width="68" stroke-linecap="round"/>
  <path d="M340 468 L512 296 L684 468" fill="none" stroke="#ffffff" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- commits -->
  <circle cx="512" cy="790" r="74" fill="#0f1722" stroke="#fff" stroke-width="40"/>
  <circle cx="712" cy="712" r="58" fill="#0f1722" stroke="#7fb0ff" stroke-width="34"/>
</svg>
